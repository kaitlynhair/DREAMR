services:
  dreamr:
    build:
      context: .
      target: shiny
      args:
        SHINY_ENV: ${SHINY_ENV:-prod}
    container_name: dreamr-shiny
    ports:
      - "3838:3838"
    volumes:
      - ./shiny_app:/srv/shiny-server/dreamr
    environment:
      - SHINY_LOG_LEVEL=INFO
      - SHINY_ENV=${SHINY_ENV:-prod}
    restart: unless-stopped

  rstudio:
    build:
      context: .
      target: rstudio
    container_name: dreamr-rstudio
    ports:
      - "8787:8787"
    environment:
      - PASSWORD=${RSTUDIO_PASSWORD:-rstudio}
      - DISABLE_AUTH=false
    volumes:
      - ./:/home/rstudio/project
    working_dir: /home/rstudio/project
    restart: unless-stopped